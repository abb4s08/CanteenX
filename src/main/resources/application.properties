server.port=8080
spring.application.name=CanteenX

# Database Configuration (supports environment variables or local fallback)
canteenx.db.url=${CANTEENX_DB_URL:jdbc:mysql://localhost:3306/canteenx?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
canteenx.db.user=${CANTEENX_DB_USER:root}
canteenx.db.password=${CANTEENX_DB_PASSWORD:}

# JSON serialization
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=Asia/Kolkata
